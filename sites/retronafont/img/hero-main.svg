<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c2a2"/>
      <stop offset="0.48" stop-color="#c9ad88"/>
      <stop offset="1" stop-color="#b9946f"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .06"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" filter="url(#grain)" opacity=".8"/>
</svg>